<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>音ゲークレジット管理</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div><p class="eyebrow">ARCADE CREDIT LOG</p><h1>音ゲークレジット管理</h1></div><div id="status" class="status">未開始</div></header>
<section class="hero"><p>今回の合計</p><strong id="sessionTotal">¥0</strong><span id="sessionDate">開始すると日付が固定されます</span></section>
<button id="start" class="primary">今日の音ゲーを開始</button>
<section id="games" class="games hidden">
<div class="gameCard maimaiCard"><div class="maimaiColumns"><div class="creditUnit"><span class="gameName">maimai</span><b id="maimaiCount">0 クレ</b><div class="stepper"><button data-action="sub" data-game="maimai">−</button><strong>100円</strong><button data-action="add" data-game="maimai">＋</button></div></div><div class="creditUnit"><span class="gameName">フリーダム</span><b id="freedomCount">0 回</b><div class="stepper"><button data-action="sub" data-game="freedom">−</button><strong>200円</strong><button data-action="add" data-game="freedom">＋</button></div></div></div><div class="gameSubtotal"><span>合計</span><strong id="maimaiTotal">¥0</strong></div></div>
<div class="gameCard"><div class="gameHead"><span>CHUNITHM</span><b id="chunithmCount">0 クレ</b></div><div class="stepper"><button data-action="sub" data-game="chunithm">−</button><strong>100円</strong><button data-action="add" data-game="chunithm">＋</button></div></div>
<div class="gameCard"><div class="gameHead"><span>オンゲキ</span><b id="ongekiCount">0 クレ</b></div><div class="stepper"><button data-action="sub" data-game="ongeki">−</button><strong>100円</strong><button data-action="add" data-game="ongeki">＋</button></div></div>
<div class="gameCard"><div class="gameHead"><span>太鼓の達人</span><b id="taikoCount">0 クレ</b></div><div class="stepper"><button data-action="sub" data-game="taiko">−</button><strong>100円</strong><button data-action="add" data-game="taiko">＋</button></div></div>
</section>
<div id="sessionActions" class="actions hidden"><button id="finish" class="danger">今日の音ゲー終了・集計確定</button></div>
<section class="summary"><div><p>今月の合計</p><strong id="monthTotal">¥0</strong></div><button id="prevMonth" class="monthNav">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" class="monthNav">›</button></section>
<section class="calendar"><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="grid"></div></section>
<p class="note">記録は今月と前月のみ保持します。</p>
</main><script src="/app.js"></script></body></html>
